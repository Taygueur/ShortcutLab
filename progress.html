<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
    <title>ShortcutLab — Ma progression</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: "Poppins", sans-serif;
            overflow-x: hidden;
        }

        /* =========================
           VAGUES
        ========================= */

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 900px;
            height: 900px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.04);
            pointer-events: none;
            z-index: -2;
        }

        body::before {
            top: -500px;
            left: -250px;
        }

        body::after {
            bottom: -550px;
            right: -250px;
        }

        .wave {
            position: fixed;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.035);
            pointer-events: none;
            z-index: -1;
            animation: waveMove 12s ease-in-out infinite alternate;
        }

        .wave.one {
            top: -350px;
            right: -250px;
        }

        .wave.two {
            bottom: -400px;
            left: -300px;
            animation-delay: 2s;
        }

        @keyframes waveMove {

            from {
                transform: translate(0,0) scale(1);
            }

            to {
                transform: translate(30px,20px) scale(1.08);
            }

        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            width: min(1200px,92%);
            margin: auto;
            padding: 25px 0;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: "Orbitron", sans-serif;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 2px;

            color: white;
            text-decoration: none;
            cursor: pointer;

            transition: 0.25s ease;
        }

        .logo span {
            color: #777;
            transition: 0.25s ease;
        }

        .logo:hover {
            transform: translateY(-1px);
        }

        .logo:hover span {
            color: white;
        }

        .back {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        .back:hover {
            color: white;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: min(900px, 90%);
            margin: 70px auto 100px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 45px;
        }

        .small-title {
            color: #777;
            font-family: "Orbitron", sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        h1 {
            font-family: "Orbitron", sans-serif;
            font-size: clamp(35px,6vw,60px);
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        h1 span {
            color: transparent;
            -webkit-text-stroke: 1px white;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-top: 15px;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat {
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.025);
            border-radius: 16px;
        }

        .stat-label {
            color: #666;
            font-family: "Orbitron", sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-family: "Orbitron", sans-serif;
            font-size: 30px;
            font-weight: 800;
        }

        .stat-value span {
            color: #666;
            font-size: 15px;
        }

        /* =========================
           PROGRESSION
        ========================= */

        .progress-card {
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.025);
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-title {
            font-weight: 600;
        }

        #progressPercent {
            font-family: "Orbitron", sans-serif;
            font-size: 13px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #161616;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: white;
            transition: width 0.7s ease;
        }

        /* =========================
           NIVEAU
        ========================= */

        .level-card {
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.025);
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .level-label {
            color: #666;
            font-family: "Orbitron", sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        #level {
            font-family: "Orbitron", sans-serif;
            font-size: 25px;
            margin-bottom: 8px;
        }

        #message {
            color: #777;
            font-size: 13px;
        }

        /* =========================
           BOUTONS
        ========================= */

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .button {
            flex: 1;
            padding: 15px;
            border-radius: 11px;
            border: 1px solid white;
            background: white;
            color: black;

            text-decoration: none;
            text-align: center;

            font-weight: 700;
            font-size: 13px;

            transition: 0.2s;
        }

        .button:hover {
            background: transparent;
            color: white;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .container {
                margin-top: 45px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <!-- VAGUES -->

    <div class="wave one"></div>
    <div class="wave two"></div>


    <!-- NAVIGATION -->

    <nav>

        <a href="index.html" class="logo">
    <img src="logo.png" alt="ShortcutLab">
</a>

        <a href="index.html" class="back">
            ← Accueil
        </a>

    </nav>


    <!-- CONTENU -->

    <main class="container">


        <header class="header">

            <div class="small-title">
                03 // PROGRESSION
            </div>

            <h1>
                MA <span>PROGRESSION</span>
            </h1>

            <p class="subtitle">
                Suis ton évolution sur ShortcutLab.
            </p>

        </header>


        <!-- STATS -->

        <section class="stats">

            <div class="stat">

                <div class="stat-label">
                    RACCOURCIS APPRIS
                </div>

                <div class="stat-value">
                    <span id="shortcutsLearned">0</span>
                    <span>/ 10</span>
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    MEILLEUR QUIZ
                </div>

                <div class="stat-value">
                    <span id="bestQuiz">0</span>
                    <span>/ 10</span>
                </div>

            </div>

        </section>


        <!-- PROGRESSION -->

        <section class="progress-card">

            <div class="progress-top">

                <div class="progress-title">
                    Progression générale
                </div>

                <div id="progressPercent">
                    0%
                </div>

            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>

            </div>

        </section>


        <!-- NIVEAU -->

        <section class="level-card">

            <div class="level-label">
                NIVEAU ACTUEL
            </div>

            <div id="level">
                DÉBUTANT
            </div>

            <p id="message">
                Commence à apprendre tes premiers raccourcis.
            </p>

        </section>


        <!-- BOUTONS -->

        <div class="buttons">

            <a
                href="shortcuts.html"
                class="button"
            >
                APPRENDRE LES RACCOURCIS
            </a>

            <a
                href="quiz.html"
                class="button"
            >
                LANCER LE QUIZ
            </a>

        </div>


    </main>


    <!-- JAVASCRIPT -->

    <script>

        /* =========================
           RACCOURCIS APPRIS
        ========================= */

        const mastered =
            JSON.parse(
                localStorage.getItem("masteredShortcuts")
            ) || [];


        const shortcutsLearned =
            mastered.length;


        /* =========================
           MEILLEUR SCORE
        ========================= */

        const bestQuiz =
            parseInt(
                localStorage.getItem("bestQuizScore")
            ) || 0;


        /* =========================
           PROGRESSION
        ========================= */

        const shortcutProgress =
            (shortcutsLearned / 10) * 100;

        const quizProgress =
            (bestQuiz / 10) * 100;

        const generalProgress =
            Math.round(
                (shortcutProgress + quizProgress) / 2
            );


        /* =========================
           AFFICHAGE
        ========================= */

        document.getElementById("shortcutsLearned")
            .textContent = shortcutsLearned;

        document.getElementById("bestQuiz")
            .textContent = bestQuiz;

        document.getElementById("progressPercent")
            .textContent = generalProgress + "%";

        document.getElementById("progressFill")
            .style.width = generalProgress + "%";


        /* =========================
           NIVEAU
        ========================= */

        const level =
            document.getElementById("level");

        const message =
            document.getElementById("message");


        if (generalProgress >= 90) {

            level.textContent = "EXPERT";

            message.textContent =
                "🔥 Impressionnant. Tu maîtrises presque tout !";

        }

        else if (generalProgress >= 70) {

            level.textContent = "AVANCÉ";

            message.textContent =
                "💪 Très bon niveau. Continue comme ça !";

        }

        else if (generalProgress >= 40) {

            level.textContent = "INTERMÉDIAIRE";

            message.textContent =
                "⚡ Tu progresses bien. Encore quelques efforts !";

        }

        else {

            level.textContent = "DÉBUTANT";

            message.textContent =
                "🚀 Continue à apprendre pour améliorer ton niveau.";

        }

    </script>

</body>

</html>
