<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShortcutLab — Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;

            background: #050505;

            color: white;

            font-family: "Poppins", sans-serif;

            overflow-x: hidden;
        }


        /* ==========================================
           VAGUES
        ========================================== */

        body::before,
        body::after {

            content: "";

            position: fixed;

            width: 900px;
            height: 900px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.04);

            pointer-events: none;

            z-index: -2;
        }


        body::before {

            top: -500px;
            left: -250px;
        }


        body::after {

            bottom: -550px;
            right: -250px;
        }


        .wave {

            position: fixed;

            width: 700px;
            height: 700px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.035);

            pointer-events: none;

            z-index: -1;

            animation: waveMove 12s ease-in-out infinite alternate;
        }


        .wave.one {

            top: -350px;
            right: -250px;
        }


        .wave.two {

            bottom: -400px;
            left: -300px;

            animation-delay: 2s;
        }


        @keyframes waveMove {

            from {
                transform: translate(0,0) scale(1);
            }

            to {
                transform: translate(30px,20px) scale(1.08);
            }

        }


        /* ==========================================
           NAVIGATION
        ========================================== */

        nav {

            width: min(1200px,92%);

            margin: auto;

            padding: 25px 0;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .logo {
    font-family: "Orbitron", sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 2px;

    color: white;
    text-decoration: none;
    cursor: pointer;

    transition: 0.25s ease;
}

.logo span {
    color: #777;
    transition: 0.25s ease;
}

.logo:hover {
    transform: translateY(-1px);
}

.logo:hover span {
    color: white;
}


        .logo span {
            color: #777;
        }


        .back {

            color: #888;

            text-decoration: none;

            font-size: 13px;

            transition: 0.2s;
        }


        .back:hover {
            color: white;
        }


        /* ==========================================
           CONTAINER
        ========================================== */

        .quiz-container {

            width: min(800px,90%);

            margin: 70px auto 100px;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .quiz-header {

            text-align: center;

            margin-bottom: 40px;
        }


        .small-title {

            color: #777;

            font-family: "Orbitron", sans-serif;

            font-size: 11px;

            letter-spacing: 4px;

            margin-bottom: 15px;
        }


        h1 {

            font-family: "Orbitron", sans-serif;

            font-size: clamp(35px,6vw,60px);

            letter-spacing: -2px;

            text-transform: uppercase;
        }


        h1 span {

            color: transparent;

            -webkit-text-stroke: 1px white;
        }


        .subtitle {

            color: #777;

            font-size: 14px;

            margin-top: 15px;
        }


        /* ==========================================
           SCORE
        ========================================== */

        .quiz-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }


        .question-number {

            color: #777;

            font-family: "Orbitron", sans-serif;

            font-size: 11px;

            letter-spacing: 2px;
        }


        .score {

            font-family: "Orbitron", sans-serif;

            font-size: 13px;
        }


        /* ==========================================
           PROGRESSION QUIZ
        ========================================== */

        .quiz-progress {

            width: 100%;

            height: 5px;

            background: #161616;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 25px;
        }


        .quiz-progress-fill {

            width: 0%;

            height: 100%;

            background: white;

            transition: width 0.4s ease;
        }


        /* ==========================================
           QUESTION
        ========================================== */

        .question-card {

            padding: 35px;

            border-radius: 18px;

            border: 1px solid rgba(255,255,255,0.1);

            background: rgba(255,255,255,0.025);

            margin-bottom: 15px;
        }


        .question-label {

            color: #666;

            font-family: "Orbitron", sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            margin-bottom: 20px;
        }


        #question {

            font-size: clamp(20px,4vw,28px);

            line-height: 1.4;

            font-weight: 600;
        }


        /* ==========================================
           RÉPONSES
        ========================================== */

        .answers {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }


        .answer {

            min-height: 70px;

            padding: 15px 18px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.1);

            background: #0d0d0d;

            color: #aaa;

            cursor: pointer;

            text-align: left;

            font-family: "Poppins", sans-serif;

            font-size: 13px;

            transition: 0.2s;
        }


        .answer:hover:not(:disabled) {

            border-color: rgba(255,255,255,0.4);

            color: white;

            transform: translateY(-2px);
        }


        .answer:disabled {
            cursor: default;
        }


        .answer.correct {

            background: white;

            color: black;

            border-color: white;
        }


        .answer.wrong {

            background: #1a1a1a;

            color: #777;

            border-color: #555;
        }


        /* ==========================================
           BOUTON SUIVANT
        ========================================== */

        .next-button {

            width: 100%;

            margin-top: 15px;

            padding: 16px;

            border: 1px solid white;

            border-radius: 11px;

            background: white;

            color: black;

            font-family: "Poppins", sans-serif;

            font-weight: 700;

            font-size: 13px;

            cursor: pointer;

            transition: 0.2s;

            display: none;
        }


        .next-button:hover {

            background: transparent;

            color: white;
        }


        /* ==========================================
           RÉSULTAT
        ========================================== */

        .result {

            display: none;

            text-align: center;

            padding: 45px 30px;

            border-radius: 20px;

            border: 1px solid rgba(255,255,255,0.12);

            background: rgba(255,255,255,0.025);
        }


        .result-icon {

            font-size: 50px;

            margin-bottom: 15px;
        }


        .result h2 {

            font-family: "Orbitron", sans-serif;

            font-size: 28px;

            margin-bottom: 15px;
        }


        .result-score {

            font-family: "Orbitron", sans-serif;

            font-size: 55px;

            font-weight: 800;

            margin-bottom: 10px;
        }


        .result-text {

            color: #888;

            font-size: 14px;

            margin-bottom: 25px;
        }


        .best-score {

            color: #666;

            font-size: 12px;

            margin-bottom: 25px;
        }


        .restart-button {

            padding: 14px 25px;

            border-radius: 10px;

            border: 1px solid white;

            background: white;

            color: black;

            font-family: "Poppins", sans-serif;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }


        .restart-button:hover {

            background: transparent;

            color: white;
        }


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width:700px) {

            .quiz-container {
                margin-top: 45px;
            }


            .answers {
                grid-template-columns: 1fr;
            }


            .question-card {
                padding: 25px;
            }

        }

    </style>

</head>


<body>

    <!-- VAGUES -->

    <div class="wave one"></div>
    <div class="wave two"></div>


    <!-- NAVIGATION -->

    <nav>

       <a href="index.html" class="logo">
    SHORTCUT<span>LAB</span>
</a>

        <a
            href="shortcuts.html"
            class="back"
        >
            ← Retour aux raccourcis
        </a>

    </nav>


    <!-- QUIZ -->

    <main class="quiz-container">


        <!-- HEADER -->

        <header class="quiz-header">

            <div class="small-title">
                02 // TRAINING
            </div>

            <h1>
                MODE <span>QUIZ</span>
            </h1>

            <p class="subtitle">
                Teste tes connaissances sur les raccourcis Windows.
            </p>

        </header>


        <!-- QUIZ -->

        <section id="quiz">


            <div class="quiz-top">

                <div
                    class="question-number"
                    id="questionNumber"
                >
                    QUESTION 1 / 10
                </div>

                <div
                    class="score"
                    id="score"
                >
                    SCORE : 0
                </div>

            </div>


            <div class="quiz-progress">

                <div
                    class="quiz-progress-fill"
                    id="quizProgress"
                ></div>

            </div>


            <div class="question-card">

                <div class="question-label">
                    QUESTION
                </div>

                <div id="question">
                    Chargement...
                </div>

            </div>


            <div
                class="answers"
                id="answers"
            ></div>


            <button
                class="next-button"
                id="nextButton"
            >
                QUESTION SUIVANTE →
            </button>

        </section>


        <!-- RÉSULTAT -->

        <section
            class="result"
            id="result"
        >

            <div class="result-icon">
                🏆
            </div>

            <h2>
                QUIZ TERMINÉ
            </h2>

            <div
                class="result-score"
                id="finalScore"
            >
                0 / 10
            </div>

            <p
                class="result-text"
                id="resultText"
            >
                Bien joué !
            </p>

            <p
                class="best-score"
                id="bestScore"
            >
                Meilleur score : 0 / 10
            </p>

            <button
                class="restart-button"
                id="restartButton"
            >
                ↻ REJOUER
            </button>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/quiz.js"></script>

</body>

</html>
